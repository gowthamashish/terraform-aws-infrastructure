name: "Terraform CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform:
    name: "Terraform Format, Validate & Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check (terraform fmt)
        run: terraform fmt -check

      - name: Terraform Init (Validation Mode)
        run: terraform init -backend=false

      - name: Terraform Validate (terraform validate)
        run: terraform validate

      - name: Terraform Plan (Dry Run Reference)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: terraform plan -no-color